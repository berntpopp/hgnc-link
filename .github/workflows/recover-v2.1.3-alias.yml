name: Recover HGNC Link v2.1.3 alias

on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: hgnc-link-v2.1.3-alias-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify release identity and apply identical manifest alias
        shell: bash
        run: |
          set -euo pipefail

          image=ghcr.io/berntpopp/hgnc-link
          release_tag=v2.1.3
          version_alias=2.1.3
          source_revision=0f318f20ba6ecf81682919718a416e018f84fe98
          source_alias=sha-0f318f20ba6ecf81682919718a416e018f84fe98
          accepted_digest=sha256:1b9f67c4d072dc84071fa65e72bebb8449df9935504bc4e7e9c398719eb6f31a

          tools_dir="$RUNNER_TEMP/v2.1.3-alias-recovery"
          mkdir -p "$tools_dir"

          gh_version=2.96.0
          gh_sha256=83d5c2ccad5498f58bf6368acb1ab32588cf43ab3a4b1c301bf36328b1c8bd60
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tools_dir/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_amd64.tar.gz"
          echo "$gh_sha256  $tools_dir/gh.tar.gz" | sha256sum -c -
          tar -xzf "$tools_dir/gh.tar.gz" -C "$tools_dir"
          gh="$tools_dir/gh_${gh_version}_linux_amd64/bin/gh"

          oras_version=1.3.3
          oras_sha256=9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tools_dir/oras.tar.gz" \
            "https://github.com/oras-project/oras/releases/download/v${oras_version}/oras_${oras_version}_linux_amd64.tar.gz"
          echo "$oras_sha256  $tools_dir/oras.tar.gz" | sha256sum -c -
          tar -xzf "$tools_dir/oras.tar.gz" -C "$tools_dir" oras
          oras="$tools_dir/oras"

          "$gh" release verify "$release_tag" --repo "$GITHUB_REPOSITORY"
          printf '%s' "$GH_TOKEN" | "$oras" login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin

          source_digest="$($oras manifest fetch --descriptor "$image:$source_alias" | jq -er .digest)"
          test "$source_digest" = "$accepted_digest"

          manifest="$($oras manifest fetch "$image@$source_digest")"
          config_digest="$(jq -er .config.digest <<<"$manifest")"
          revision="$($oras blob fetch --output - "$image@$config_digest" | \
            jq -er '.config.Labels["org.opencontainers.image.revision"]')"
          test "$revision" = "$source_revision"

          if version_json="$($oras manifest fetch --descriptor "$image:$version_alias" 2>/dev/null)"; then
            version_digest="$(jq -er .digest <<<"$version_json")"
          else
            "$oras" cp "$image:$source_alias" "$image:$version_alias"
            version_digest="$($oras manifest fetch --descriptor "$image:$version_alias" | jq -er .digest)"
          fi

          test "$version_digest" = "$accepted_digest"
          printf 'source_alias=%s\nversion_alias=%s\nrevision=%s\n' \
            "$source_digest" "$version_digest" "$revision" >> "$GITHUB_STEP_SUMMARY"
