name: hgnc-link

services:
  # Restores the pinned HGNC data release (a `data-hgnc-*` GitHub release of
  # this repo, digest-verified) into the volume, then exits. Pins live in
  # hgnc_link/config.py and container-release.json; nothing is downloaded from
  # genenames.org / storage.googleapis.com at boot.
  hgnc-data-init:
    build: &build
      context: ..
      dockerfile: docker/Dockerfile
      target: production
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
        VCS_REF: ${VCS_REF:-0000000000000000000000000000000000000000}
        BUILD_DATE: ${BUILD_DATE:-1970-01-01T00:00:00Z}
    image: hgnc-link:latest
    command: ["hgnc-link-data", "materialize-data"]
    environment:
      HGNC_LINK_IMMUTABLE_DATA__REFERENCE_ROOT: /data
    volumes:
      - hgnc-data:/data
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hgnc-network

  hgnc-link:
    build: *build
    image: hgnc-link:latest
    container_name: hgnc-link
    depends_on:
      hgnc-data-init:
        condition: service_completed_successfully
    # Dev/local only — loopback-bound (127.0.0.1) so copying this file to a
    # server never publishes the unauthenticated backend on the public IP
    # (Docker would otherwise bind 0.0.0.0 and bypass the host firewall).
    # Production fronts the container with a reverse proxy via the prod/npm
    # overlays (ports: !reset []). Backends are unauthenticated by design.
    ports:
      - "127.0.0.1:${HGNC_LINK_HOST_PORT:-8000}:8000"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.docker
        required: false
    environment:
      HGNC_LINK_HOST: 0.0.0.0
      HGNC_LINK_PORT: 8000
      HGNC_LINK_TRANSPORT: unified
      HGNC_LINK_MCP_PATH: /mcp
      HGNC_LINK_ALLOWED_HOSTS: '["localhost","127.0.0.1","::1"]'
      HGNC_LINK_LOG_LEVEL: INFO
      HGNC_LINK_LOG_FORMAT: json
      # Serve the restored release read-only (see docs/data.md).
      HGNC_LINK_DATA__DATA_DIR: /data
      HGNC_LINK_DATA__DB_FILENAME: current/hgnc.sqlite
      HGNC_LINK_DATA__AUTO_BOOTSTRAP: "false"
      HGNC_LINK_DATA__REFRESH_ENABLED: "false"
    volumes:
      - hgnc-data:/data:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: localhost", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # Container & Deployment Hardening Standard v1 (backported so running the base
    # file directly is still safe). The restored SQLite index lives on the
    # `hgnc-data` named volume (read-only here); the rootfs is read-only and
    # scratch is an explicit, size-capped tmpfs (TMPDIR=/tmp in the image).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    init: true
    # Limits are declared ONLY as deploy.resources.limits, which Compose v2 honors.
    # The legacy non-swarm aliases (mem_limit/cpus) must NOT be set alongside them:
    # Compose rejects the project outright when an alias and its deploy.resources
    # counterpart disagree, and any overlay that retunes deploy.resources.limits
    # (the central container-CI smoke stack does) cannot reset a legacy alias. The
    # production overlay already resets these aliases, so runtime limits are unchanged.
    pids_limit: 256
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
          pids: 256
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - hgnc-network

volumes:
  hgnc-data:
    driver: local

networks:
  hgnc-network:
    driver: bridge
